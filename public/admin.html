<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Usuarios y Comentarios</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: block;
            padding: 20px;
        }
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }
        th {
            color: #818cf8;
            font-weight: 600;
        }
        .badge-verify {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-pending {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .btn-delete {
            background: rgba(244, 63, 94, 0.2);
            color: #f43f5e;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: #f43f5e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>

    <!-- SECCIÓN 1: USUARIOS REGISTRADOS -->
    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 style="color: white; margin-bottom: 5px;">Panel de Administración</h2>
                <p class="subtitle" style="margin: 0;">Lista de usuarios registrados en el sistema</p>
            </div>
            <a href="index.html" class="btn-primary" style="padding: 8px 16px; font-size: 12px; text-decoration: none; width: auto;">Ir al Inicio</a>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombres y Apellidos</th>
                        <th>Cédula</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios">
                    <!-- Los usuarios se cargarán aquí automáticamente -->
                </tbody>
            </table>
        </div>
        <div id="admin-message" style="margin-top: 15px; text-align: center; font-size: 13px;"></div>
    </div>

    <!-- SECCIÓN 2: COMENTARIOS Y ESTRELLAS -->
    <div class="admin-container">
        <h2 style="color: white; margin-bottom: 5px;">Comentarios y Calificaciones</h2>
        <p class="subtitle" style="margin: 0; margin-bottom: 20px;">Reseñas enviadas por los usuarios desde la página principal</p>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Estrellas</th>
                        <th>Comentario</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="tabla-comentarios">
                    <!-- Los comentarios se cargarán aquí automáticamente -->
                </tbody>
            </table>
        </div>
        <div id="comentarios-message" style="margin-top: 15px; text-align: center; font-size: 13px;"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tablaUsuarios = document.getElementById('tabla-usuarios');
            const adminMessage = document.getElementById('admin-message');
            const tablaComentarios = document.getElementById('tabla-comentarios');
            const comentariosMessage = document.getElementById('comentarios-message');

            // 1. Cargar Usuarios
            try {
                const response = await fetch('/api/admin/usuarios');
                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.usuarios.length === 0) {
                        adminMessage.textContent = 'No hay usuarios registrados todavía.';
                    } else {
                        tablaUsuarios.innerHTML = '';
                        data.usuarios.forEach(user => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${user.id}</td>
                                <td>${user.nombres} ${user.apellidos}</td>
                                <td>${user.cedula}</td>
                                <td>${user.telefono}</td>
                                <td>${user.email}</td>
                                <td>${user.verificado === 1 ? '<span class="badge-verify">Verificado</span>' : '<span class="badge-pending">Pendiente</span>'}</td>
                                <td><button class="btn-delete" onclick="eliminarUsuario(${user.id})"><i class="fa-solid fa-trash"></i></button></td>
                            `;
                            tablaUsuarios.appendChild(tr);
                        });
                    }
                } else {
                    adminMessage.textContent = 'Error al cargar los usuarios.';
                    adminMessage.style.color = '#f43f5e';
                }
            } catch (err) {
                console.error(err);
                adminMessage.textContent = 'Error de conexión con el servidor.';
                adminMessage.style.color = '#f43f5e';
            }

            // 2. Cargar Comentarios y Estrellas
            try {
                const resCom = await fetch('/api/admin/comentarios');
                const dataCom = await resCom.json();

                if (resCom.ok && dataCom.success) {
                    if (dataCom.comentarios.length === 0) {
                        comentariosMessage.textContent = 'No hay comentarios registrados todavía.';
                    } else {
                        tablaComentarios.innerHTML = '';
                        dataCom.comentarios.forEach(c => {
                            const estrellasHTML = '★'.repeat(c.estrellas) + '☆'.repeat(5 - c.estrellas);
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td style="font-weight: bold; color: #818cf8;">${c.nombre}</td>
                                <td style="color: #f59e0b;">${estrellasHTML} (${c.estrellas}/5)</td>
                                <td>${c.comentario}</td>
                                <td style="font-size: 11px; color: #94a3b8;">${c.fecha || ''}</td>
                            `;
                            tablaComentarios.appendChild(tr);
                        });
                    }
                } else {
                    comentariosMessage.textContent = 'Error al cargar los comentarios.';
                    comentariosMessage.style.color = '#f43f5e';
                }
            } catch (err) {
                console.error(err);
                comentariosMessage.textContent = 'Error de conexión al cargar comentarios.';
                comentariosMessage.style.color = '#f43f5e';
            }
        });

        async function eliminarUsuario(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este usuario?')) {
                try {
                    const response = await fetch(`/api/admin/usuarios/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('No se pudo eliminar el usuario.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Error de conexión.');
                }
            }
        }
    </script>
</body>
</html>
